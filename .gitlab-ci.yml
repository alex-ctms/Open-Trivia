stages:
  - build

# Both images are tagged from the frontend's package.json version, matching
# this repo's prior GitHub Actions convention (see .github/workflows/docker-publish.yml).
#
# Built with Kaniko, not docker build+dind: this instance's shared runner
# uses the Kubernetes executor with privileged:false (deliberate hardening,
# not something to weaken for one project), so a real Docker daemon can't
# run in a job pod. Kaniko builds/pushes OCI images daemonless.
.build_image:
  stage: build
  image:
    name: gcr.io/kaniko-project/executor:debug
    entrypoint: [""]
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    - if: '$CI_COMMIT_TAG'
  before_script:
    - VERSION=$(sh .gitlab/ci/version.sh frontend/package.json)
    - mkdir -p /kaniko/.docker
    - AUTH=$(printf '%s:%s' "$CI_REGISTRY_USER" "$CI_REGISTRY_PASSWORD" | base64 | tr -d '\n')
    - printf '{"auths":{"%s":{"auth":"%s"}}}' "$CI_REGISTRY" "$AUTH" > /kaniko/.docker/config.json

build-frontend:
  extends: .build_image
  script:
    - /kaniko/executor --context "$CI_PROJECT_DIR/frontend" --dockerfile "$CI_PROJECT_DIR/frontend/Dockerfile" --destination "$CI_REGISTRY_IMAGE/frontend:v$VERSION" --destination "$CI_REGISTRY_IMAGE/frontend:latest"

build-backend:
  extends: .build_image
  script:
    - /kaniko/executor --context "$CI_PROJECT_DIR/backend" --dockerfile "$CI_PROJECT_DIR/backend/Dockerfile" --destination "$CI_REGISTRY_IMAGE/backend:v$VERSION" --destination "$CI_REGISTRY_IMAGE/backend:latest"
