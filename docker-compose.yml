services:
  db:
    image: postgres:15-alpine
    environment:
      - POSTGRES_USER=trivia_user
      - POSTGRES_PASSWORD=trivia_pass
      - POSTGRES_DB=trivia_db
    volumes:
      - postgres_data:/var/lib/postgresql/data/

  frontend:
    build: ./frontend
    ports:
      - "3009:3000"
    depends_on:
      - backend
    environment:
      - REACT_APP_API_URL=/api
#      - REACT_APP_API_URL=http://localhost:5000/api
#      - REACT_APP_API_URL=http://backend:5000/api

  backend:
    build: ./backend
    ports:
      - "5000:5000"
    environment:
      - PG_HOST=db
      - PG_PORT=5432
      - PG_USER=trivia_user
      - PG_PASSWORD=trivia_pass
      - PG_DB=trivia_db
      - JWT_SECRET=LW3u9ojVDxZUYku7Kks6ZUS3PMw3A6K3
    depends_on:
      - db

volumes:
  postgres_data:
