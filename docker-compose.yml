services:
  frontend:
    build: ./frontend
    ports:
      - "3008:3000"
    depends_on:
      - backend
    environment:
      - REACT_APP_API_URL=http://backend:5000

  backend:
    build: ./backend
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - JWT_SECRET=super_secret_key_123
      - PG_USER=trivia_user
      - PG_PASSWORD=trivia_pass
      - PG_DB=trivia_db
      - PG_HOST=db
      - PG_PORT=5432
    depends_on:
      - db

  db:
    image: postgres:15-alpine
    environment:
      - POSTGRES_USER=trivia_user
      - POSTGRES_PASSWORD=trivia_pass
      - POSTGRES_DB=trivia_db
    volumes:
      - postgres_data:/var/lib/postgresql/data/

volumes:
  postgres_data:
