apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "open-trivia.fullname" . }}-backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: {{ include "open-trivia.fullname" . }}-backend
  template:
    metadata:
      labels:
        app: {{ include "open-trivia.fullname" . }}-backend
    spec:
      {{- if .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml .Values.imagePullSecrets | nindent 8 }}
      {{- end }}
      containers:
        - name: backend
          image: {{ .Values.image.backend.repository }}:{{ .Values.image.backend.tag }}
          ports:
            - containerPort: {{ .Values.backend.service.port }}
          env:
            - name: PORT
              value: {{ .Values.backend.service.port | quote }}
            - name: PG_HOST
              valueFrom: { configMapKeyRef: { name: {{ include "open-trivia.fullname" . }}-config, key: PG_HOST } }
            - name: PG_PORT
              valueFrom: { configMapKeyRef: { name: {{ include "open-trivia.fullname" . }}-config, key: PG_PORT } }
            - name: PG_USER
              valueFrom: { configMapKeyRef: { name: {{ include "open-trivia.fullname" . }}-config, key: PG_USER } }
            - name: PG_PASSWORD
              valueFrom: { secretKeyRef: { name: {{ include "open-trivia.fullname" . }}-secret, key: PG_PASSWORD } }
            - name: PG_DB
              valueFrom: { configMapKeyRef: { name: {{ include "open-trivia.fullname" . }}-config, key: PG_DB } }
            - name: JWT_SECRET
              valueFrom: { secretKeyRef: { name: {{ include "open-trivia.fullname" . }}-secret, key: JWT_SECRET } }
            - name: APP_URL
              valueFrom: { configMapKeyRef: { name: {{ include "open-trivia.fullname" . }}-config, key: APP_URL } }
            - name: PUBLIC_APP_URL
              valueFrom: { configMapKeyRef: { name: {{ include "open-trivia.fullname" . }}-config, key: PUBLIC_APP_URL } }
            - name: ADMIN_EMAIL
              valueFrom: { configMapKeyRef: { name: {{ include "open-trivia.fullname" . }}-config, key: ADMIN_EMAIL } }
            - name: ADMIN_SEED_PASSWORD
              valueFrom: { secretKeyRef: { name: {{ include "open-trivia.fullname" . }}-secret, key: ADMIN_SEED_PASSWORD } }
            - name: SMTP_HOST
              valueFrom: { configMapKeyRef: { name: {{ include "open-trivia.fullname" . }}-config, key: SMTP_HOST } }
            - name: SMTP_PORT
              valueFrom: { configMapKeyRef: { name: {{ include "open-trivia.fullname" . }}-config, key: SMTP_PORT } }
            - name: SMTP_SECURE
              valueFrom: { configMapKeyRef: { name: {{ include "open-trivia.fullname" . }}-config, key: SMTP_SECURE } }
            - name: SMTP_USER
              valueFrom: { configMapKeyRef: { name: {{ include "open-trivia.fullname" . }}-config, key: SMTP_USER } }
            - name: SMTP_PASS
              valueFrom: { secretKeyRef: { name: {{ include "open-trivia.fullname" . }}-secret, key: SMTP_PASS } }
            - name: SMTP_FROM
              valueFrom: { configMapKeyRef: { name: {{ include "open-trivia.fullname" . }}-config, key: SMTP_FROM } }
            - name: DISCORD_CLIENT_ID
              valueFrom: { configMapKeyRef: { name: {{ include "open-trivia.fullname" . }}-config, key: DISCORD_CLIENT_ID } }
            - name: DISCORD_CLIENT_SECRET
              valueFrom: { secretKeyRef: { name: {{ include "open-trivia.fullname" . }}-secret, key: DISCORD_CLIENT_SECRET } }
            - name: DISCORD_REDIRECT_URI
              valueFrom: { configMapKeyRef: { name: {{ include "open-trivia.fullname" . }}-config, key: DISCORD_REDIRECT_URI } }
            - name: DISCORD_BOT_API_TOKEN
              valueFrom: { secretKeyRef: { name: {{ include "open-trivia.fullname" . }}-secret, key: DISCORD_BOT_API_TOKEN } }
            - name: DISCORD_BOT_SERVICE_URL
              valueFrom: { configMapKeyRef: { name: {{ include "open-trivia.fullname" . }}-config, key: DISCORD_BOT_SERVICE_URL } }
            - name: DISCORD_BOT_INVITE_URL
              valueFrom: { configMapKeyRef: { name: {{ include "open-trivia.fullname" . }}-config, key: DISCORD_BOT_INVITE_URL } }
