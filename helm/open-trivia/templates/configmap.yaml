apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "open-trivia.fullname" . }}-config
data:
  REACT_APP_API_URL: {{ .Values.frontend.env.REACT_APP_API_URL | quote }}
  REACT_APP_SOCKET_URL: {{ .Values.frontend.env.REACT_APP_SOCKET_URL | quote }}
  LEGAL_OPERATOR_NAME: {{ .Values.frontend.env.LEGAL_OPERATOR_NAME | quote }}
  LEGAL_CONTACT_EMAIL: {{ .Values.frontend.env.LEGAL_CONTACT_EMAIL | quote }}
  LEGAL_LAST_UPDATED: {{ .Values.frontend.env.LEGAL_LAST_UPDATED | quote }}
  PG_HOST: {{ .Values.backend.env.PG_HOST | quote }}
  PG_PORT: {{ .Values.backend.env.PG_PORT | quote }}
  PG_USER: {{ .Values.backend.env.PG_USER | quote }}
  PG_DB: {{ .Values.backend.env.PG_DB | quote }}
  APP_URL: {{ .Values.backend.env.APP_URL | quote }}
  PUBLIC_APP_URL: {{ .Values.backend.env.PUBLIC_APP_URL | quote }}
  ADMIN_EMAIL: {{ .Values.backend.env.ADMIN_EMAIL | quote }}
  SMTP_HOST: {{ .Values.backend.env.SMTP_HOST | quote }}
  SMTP_PORT: {{ .Values.backend.env.SMTP_PORT | quote }}
  SMTP_SECURE: {{ .Values.backend.env.SMTP_SECURE | quote }}
  SMTP_USER: {{ .Values.backend.env.SMTP_USER | quote }}
  SMTP_FROM: {{ .Values.backend.env.SMTP_FROM | quote }}
  DISCORD_CLIENT_ID: {{ .Values.backend.env.DISCORD_CLIENT_ID | quote }}
  DISCORD_REDIRECT_URI: {{ .Values.backend.env.DISCORD_REDIRECT_URI | quote }}
  DISCORD_BOT_SERVICE_URL: {{ default (printf "http://%s-discord-bot:%v" (include "open-trivia.fullname" .) .Values.discordBot.service.port) .Values.backend.env.DISCORD_BOT_SERVICE_URL | quote }}
  DISCORD_BOT_INVITE_URL: {{ .Values.backend.env.DISCORD_BOT_INVITE_URL | quote }}
